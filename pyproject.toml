[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "pdfwords"
version = "0.5.0"
description = "PyMuPDF-compatible text extraction with char/word/line/block bounding boxes, built on PDFium. Apache-2.0, optional Rust core."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Quan Dang" }]
requires-python = ">=3.9"
dependencies = ["pypdfium2>=4.30"]
keywords = ["pdf", "text-extraction", "bounding-box", "pdfium", "pymupdf", "ocr", "layout", "markdown", "rag", "llm", "pdf2image", "tables", "parquet", "rtl", "cjk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Text Processing",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Typing :: Typed",
]

[project.optional-dependencies]
numpy = ["numpy"]
# editing (read_contents / redaction / insert_text / save): all permissive (BSD-3, MIT, HPND)
edit = ["pypdf>=5.1", "fonttools>=4.40", "pillow>=9"]
# visual debugging overlays (pdfwords debug / pdfwords.debug.overlay)
debug = ["pillow>=9"]
# rendering to numpy arrays / PIL images / encoded files (Page.render, to_images, compat.pdf2image)
render = ["numpy", "pillow>=9"]
# LLM integrations (all MIT): LangChain document loader, LlamaIndex reader, MCP server
langchain = ["langchain-core>=0.2"]
llamaindex = ["llama-index-core>=0.10"]
mcp = ["mcp>=1.2; python_version >= '3.10'"]
# OCR fallback (Apache-2.0): Tesseract via pytesseract (needs the tesseract binary) or RapidOCR;
# rendering for OCR needs numpy + Pillow
ocr = ["pytesseract>=0.3.10", "numpy", "pillow>=9"]
ocr-rapid = ["rapidocr_onnxruntime>=1.3", "numpy", "pillow>=9"]
# structure-preserving size optimiser (pdfwords.optimize / pdfwords shrink): pikepdf (MPL-2.0, used
# unmodified), Pillow (HPND), numpy (BSD-3), mozjpeg-lossless-optimization (BSD-3). JBIG2 (jbig2enc CLI)
# and a MozJPEG cjpeg are optional, auto-detected executables.
shrink = ["pikepdf>=8", "pillow>=9", "numpy", "mozjpeg-lossless-optimization>=1.1"]
# Table.to_pandas / doc.to_pandas (BSD-3) and Arrow / Parquet output (Apache-2.0)
tables = ["pandas>=1.3"]
arrow = ["pyarrow>=10"]
# pymupdf (AGPL) is only used by the optional accuracy tests/benchmarks, never at runtime
test = ["pytest>=7", "numpy", "pypdf>=5.1", "fonttools>=4.40", "pillow>=9"]
compare = ["pymupdf", "pdftext"]
# documentation site (mkdocs build --strict); kept in sync with docs/requirements.txt
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]

[project.urls]
Homepage = "https://github.com/dangquan1402/pdfwords"
Documentation = "https://pdfwords.readthedocs.io"
Repository = "https://github.com/dangquan1402/pdfwords"
Issues = "https://github.com/dangquan1402/pdfwords/issues"
Changelog = "https://github.com/dangquan1402/pdfwords/blob/main/CHANGELOG.md"

[project.scripts]
pdfwords = "pdfwords.__main__:main"

[tool.maturin]
python-source = "python"
module-name = "pdfwords._native"
manifest-path = "crates/pdfwords-py/Cargo.toml"
features = ["extension-module"]
include = [{ path = "LICENSE", format = "sdist" }, { path = "NOTICE", format = "sdist" }]
exclude = ["**/__pycache__/**", "**/*.pyc", "python/pdfwords/*.so", "python/pdfwords/*.pyd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
