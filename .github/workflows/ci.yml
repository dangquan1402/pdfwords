name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # faster CI builds of the extension (release wheels keep LTO)
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pypdfium2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test (with PDFium from pypdfium2)
        run: |
          export PDFWORDS_PDFIUM_LIB="$(python -c 'import os, pypdfium2_raw; print(os.path.join(os.path.dirname(pypdfium2_raw.__file__), "libpdfium.so"))')"
          cargo test --workspace

  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache downloaded test PDFs
        uses: actions/cache@v4
        with:
          path: tests/data
          key: test-pdfs-${{ hashFiles('tools/fetch_test_pdfs.py') }}
      - name: Fetch public test PDFs (tests skip if this fails)
        run: python tools/fetch_test_pdfs.py || echo "::warning::could not fetch all test PDFs; dependent tests will be skipped"
      - name: Install test dependencies
        run: |
          python -m pip install -U pip
          python -m pip install pytest numpy pypdfium2
          python -m pip install pymupdf || echo "::warning::pymupdf unavailable; accuracy tests will be skipped"
      - name: Tests - pure-Python fallback (extension absent)
        env:
          PYTHONPATH: python
          PDFWORDS_EXPECT_BACKENDS: python
        run: python -m pytest -q -ra
      - name: Build and install with the Rust extension
        run: python -m pip install -v .
      - name: Tests - Rust + Python backends, parity
        env:
          PDFWORDS_EXPECT_BACKENDS: rust,python
        run: python -m pytest -q -ra
      - name: CLI smoke test
        run: pdfwords tests/fixtures/simple_text.pdf --mode text --pages 0 | head -3
