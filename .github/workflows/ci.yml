name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # faster CI builds of the extension (release wheels keep LTO)
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pypdfium2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test (with PDFium from pypdfium2)
        run: |
          export PDFWORDS_PDFIUM_LIB="$(python -c 'import os, pypdfium2_raw; print(os.path.join(os.path.dirname(pypdfium2_raw.__file__), "libpdfium.so"))')"
          cargo test --workspace

  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache downloaded test PDFs
        uses: actions/cache@v6
        with:
          path: tests/data
          key: test-pdfs-${{ hashFiles('tools/fetch_test_pdfs.py') }}
      - name: Fetch public test PDFs (tests skip if this fails)
        run: python tools/fetch_test_pdfs.py || echo "::warning::could not fetch all test PDFs; dependent tests will be skipped"
      - name: Install test dependencies
        run: |
          python -m pip install -U pip
          python -m pip install pytest numpy pypdfium2 "pypdf>=5.1" "fonttools>=4.40" "pillow>=9"
          python -m pip install pymupdf || echo "::warning::pymupdf unavailable; accuracy tests will be skipped"
          python -m pip install pandas pyarrow || echo "::warning::pandas/pyarrow unavailable; frame tests will be skipped"
      - name: Tests - pure-Python fallback (extension absent)
        env:
          PYTHONPATH: python
          PDFWORDS_EXPECT_BACKENDS: python
        run: python -m pytest -q -ra
      - name: Build and install with the Rust extension
        run: python -m pip install -v .
      - name: Tests - Rust + Python backends, parity
        env:
          PDFWORDS_EXPECT_BACKENDS: rust,python
        run: python -m pytest -q -ra
      - name: CLI smoke test
        run: |
          pdfwords tests/fixtures/simple_text.pdf --mode text --pages 0 | head -3
          pdfwords redact tests/fixtures/irs_w9.pdf -o redacted.pdf --search "Taxpayer" --scrub
          pdfwords insert-text redacted.pdf -o inserted.pdf --text "smoke test" --point 72,72
          pdfwords inserted.pdf --mode text --pages 0 | grep -q "smoke test"
          ! pdfwords inserted.pdf --mode text | grep -qi "taxpayer"
          pdfwords tests/fixtures/irs_w9.pdf --mode words --workers 2 --flatten -o words.json
          test -s words.json
          pdfwords quality tests/fixtures/irs_w9.pdf | grep -q '"needs_ocr": \[\]'
          pdfwords pdftext tests/fixtures/simple_text.pdf | grep -q "Simple test document"
          pdfwords pdftext tests/fixtures/simple_text.pdf --json --keep_chars | grep -q '"char_idx"'
          pdfwords links tests/fixtures/simple_text.pdf > /dev/null
          pdfwords debug tests/fixtures/irs_w9.pdf --page 0 --show words,blocks,order -o overlay.png
          test -s overlay.png
          pdfwords render tests/fixtures/irs_w9.pdf --pages 0-1 --dpi 50 --out-dir rendered --workers 2
          test -s rendered/irs_w9-0001.jpg
          pdfwords render tests/fixtures/irs_w9.pdf --pages 0 --overlay words,blocks -o render_overlay.png
          test -s render_overlay.png
          pdfwords export tests/fixtures/irs_w9.pdf --pages 0-1 -o w9.md
          grep -q "^# Form W-9" w9.md
          pdfwords export tests/fixtures/irs_w9.pdf --pages 0 -f alto | python -c "import sys, xml.dom.minidom as m; m.parseString(sys.stdin.buffer.read())"
          pdfwords chunks tests/fixtures/irs_w9.pdf --pages 0 | head -1 | grep -q '"provenance"'
          pdfwords objects tests/fixtures/irs_w9.pdf --pages 0 --kind struct | grep -q '"Document"'
          pdfwords tables tests/fixtures/irs_w9.pdf --pages 0 -f md > tables.md
          pdfwords frame tests/fixtures/simple_text.pdf -o words.csv --kind words
          grep -q "^page,block,line,word" words.csv
      - name: OCR engines (Tesseract via pytesseract, RapidOCR)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr
          python -m pip install pytesseract rapidocr_onnxruntime || echo "::warning::rapidocr unavailable"
          python -m pytest -q -ra tests/test_ocr.py
          python - <<'PY'
          import pdfwords
          from pdfwords.ocr import available_engines
          print("engines:", available_engines())
          assert "tesseract" in available_engines()
          PY
      - name: LLM integrations (LangChain, LlamaIndex, MCP)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python -m pip install langchain-core llama-index-core mcp
          python -m pytest -q -ra tests/test_llm.py
          python - <<'PY'
          import json, subprocess, sys
          p = subprocess.Popen([sys.executable, "-m", "pdfwords", "mcp"], stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True)
          def send(o):
              p.stdin.write(json.dumps(o) + "\n"); p.stdin.flush()
          send({"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {"protocolVersion": "2025-06-18", "capabilities": {}, "clientInfo": {"name": "ci", "version": "0"}}})
          assert json.loads(p.stdout.readline())["id"] == 1
          send({"jsonrpc": "2.0", "method": "notifications/initialized"})
          send({"jsonrpc": "2.0", "id": 2, "method": "tools/list"})
          names = [t["name"] for t in json.loads(p.stdout.readline())["result"]["tools"]]
          assert "to_markdown" in names and "render_page" in names, names
          p.kill()
          print("mcp ok", names)
          PY
