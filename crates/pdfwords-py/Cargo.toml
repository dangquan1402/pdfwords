[package]
name = "pdfwords-py"
description = "PyO3 bindings: native backend of the `pdfwords` Python package"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pdfwords-core = { path = "../pdfwords-core", version = "0.1.0" }
pyo3 = { version = "0.25", features = ["abi3-py39"] }

[features]
default = []
# maturin enables this when building wheels
extension-module = ["pyo3/extension-module"]
